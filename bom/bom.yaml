# Bill of materials, draft (2026-11-09). Prices in USD are estimates or reseller listings
# (price_basis), to confirm before any order; nothing is ordered without the owner's OK.
# qty: what one robot uses; spares: extra bought for the bench and breakages.
# status: to buy | ordered | owned. Owned lines keep their price, so the total is the full cost
# to replicate the robot. model: the actuators.yaml key, for servo lines (checked against
# robot.yaml by tools/check_description.py).
# Not included: the 3D printer, the desktop GPU for training, shipping and import duties.

lines:
  # servos
  - {item: "Feetech STS3250 serial bus servo, 12 V", model: STS3250, group: servos, qty: 12, spares: 2, unit_usd: 45, price_basis: estimate, status: to buy}
  - {item: "Feetech STS3215 serial bus servo, 12 V (C018, 1:345)", model: STS3215-C018, group: servos, qty: 11, spares: 2, unit_usd: 18, price_basis: reseller, status: to buy}
  - {item: "USB serial bus servo adapter (half-duplex TTL)", group: servos, qty: 3, spares: 0, unit_usd: 12, price_basis: estimate, status: to buy}
  - {item: "Servo daisy-chain cables, assorted lengths", group: servos, qty: 1, spares: 0, unit_usd: 14, price_basis: estimate, status: to buy}
  # compute and sensing
  - {item: "NVIDIA Jetson Orin Nano Super developer kit, 8 GB", group: compute, qty: 1, spares: 0, unit_usd: 249, price_basis: list, status: owned}
  - {item: "microSD or NVMe SSD for the computer, 128 GB", group: compute, qty: 1, spares: 0, unit_usd: 20, price_basis: estimate, status: to buy}
  - {item: "IMU (BMI088 or BNO085 class) on a small USB microcontroller board", group: sensing, qty: 1, spares: 0, unit_usd: 30, price_basis: estimate, status: to buy}
  - {item: "Wide-angle CSI camera module and cable", group: sensing, qty: 1, spares: 0, unit_usd: 30, price_basis: estimate, status: to buy}
  # power
  - {item: "3S Li-ion pack, about 3 Ah, with protection board", group: power, qty: 2, spares: 0, unit_usd: 35, price_basis: estimate, status: to buy}
  - {item: "Balance charger for 3S packs", group: power, qty: 1, spares: 0, unit_usd: 50, price_basis: estimate, status: to buy}
  - {item: "Power parts: fuse and holder, e-stop switch and relay, buck-boost for the computer, connectors, wire", group: power, qty: 1, spares: 0, unit_usd: 60, price_basis: estimate, status: to buy}
  - {item: "12 V 10 A bench supply (tether for early tests)", group: power, qty: 1, spares: 0, unit_usd: 40, price_basis: estimate, status: to buy}
  # mechanical
  - {item: "Bearings, steel pins, heat-set inserts, screws", group: mechanical, qty: 1, spares: 0, unit_usd: 70, price_basis: estimate, status: to buy}
  - {item: "Filament: PETG and nylon-carbon, about 2 kg", group: mechanical, qty: 1, spares: 0, unit_usd: 90, price_basis: estimate, status: to buy}
