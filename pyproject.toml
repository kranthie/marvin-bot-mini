[project]
name = "marvin-bot-mini"
version = "0.0.1"
description = "An open, low-cost 0.6 m, 23-DOF printed humanoid on serial-bus servos and a Jetson Orin Nano"
readme = "README.md"
license = "Apache-2.0 AND CERN-OHL-S-2.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["ruff==0.17.3", "pytest"]  # ruff pinned: a new release can change formatting

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
