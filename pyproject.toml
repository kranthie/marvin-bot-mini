[project]
name = "marvin-bot-mini"
version = "0.0.1"
description = "An open, low-cost 0.6 m, 27-DOF printed humanoid on serial-bus servos and a Jetson Orin Nano"
readme = "README.md"
license = "Apache-2.0 AND CERN-OHL-S-2.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "openpyxl>=3.1,<4"]  # openpyxl: the BOM workbook

[project.optional-dependencies]
dev = ["ruff==0.17.3", "pytest"]  # ruff pinned: a new release can change formatting
sim = ["mujoco>=3.7", "numpy", "pillow", "onnxruntime"]  # pillow: renders; onnxruntime: policies
cad = ["manifold3d==3.5.4", "trimesh==5.2.0", "numpy"]  # pinned: cad_model.yaml must reproduce exactly
fea = ["pytetwild==0.4.2", "pyvista", "scikit-fem==12.0.2", "pypardiso==0.4.7", "rtree==1.4.1", "scipy"]  # cad/fea.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
