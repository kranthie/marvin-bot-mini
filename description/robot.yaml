# Marvin Bot Mini: single source of truth for joints, sizes, motors and servo buses.
# v0.1 (2026-11-09). Lengths in m; joint ranges in degrees (anatomical, see below).
# Entries containing "{side}" are expanded for left and right by tools/check_description.py.
# Joint names follow Marvin Bot's (the full-size robot), so its motion pipeline carries over.
#
# Range convention (left side; the URDF assigns axis signs):
#   pitch: + = flexion (thigh or arm forward, knee bend, toes up at the ankle)
#   roll:  + = abduction (limb away from the midline)
#   yaw:   + = rotation towards the midline (toes or hand turning in)
#   neck pitch: + = looking down

robot:
  name: marvin_bot_mini
  version: "0.1"
  height: 0.600           # sole to the top of the head, standing straight
  mass_target_kg: 3.6      # bare; 3.0 before the wrists, grippers and the stress check's frame
  mass_limit_kg: 3.9      # the full robot as it runs, battery and shells included: the torque
                          # checks pass at 3.79 kg with the shells (decisions 2026-11-11)

# v0 targets, from the design brief; phase 1's CAD sets the real values. Proportions follow
# Marvin Bot's (hip axis at about half the height, shoulders at about 0.8 of it).
dimensions:
  hip_axis_height: 0.290   # hip pitch axis to sole
  thigh: 0.120             # hip pitch axis to knee axis
  shin: 0.120              # knee axis to ankle axis
  ankle_height: 0.050      # ankle axis to sole: the ankle pitch and roll servos sit above the foot
  hip_spacing: 0.090       # between left and right leg lines
  shoulder_width: 0.200    # outside of the shoulder servos
  shoulder_height: 0.480   # shoulder pitch axis above the floor
  upper_arm: 0.100         # shoulder pitch axis to elbow axis
  forearm: 0.080           # elbow axis to the wrist yaw servo's output face
  hand: 0.080              # wrist output face to the fingertips (a two-jaw pincer); with the
                           # forearm, 0.16 m, so the hands reach the floor sitting and push the
                           # robot up (sim/mujoco/check_torques.py), as on Marvin Bot
  foot_length: 0.100
  foot_width: 0.055

# Default stance (degrees, same values on both sides): the pose the walking policies act around.
# A slight crouch keeps the knee servos off their end of travel and gives the policy room.
stance: {hip_pitch: 10, knee: 20, ankle_pitch: 10, shoulder_roll: 8, elbow: 20}
stance_pelvis_height: 0.286   # pelvis frame above the floor in the stance (MuJoCo, feet flat)

joints:
  # legs, pelvis outwards: hip roll, then pitch, then yaw, as on Marvin Bot; listed in the order
  # the policies use
  - {name: "{side}_hip_pitch",      axis: pitch, range: [-30, 120]}
  - {name: "{side}_hip_roll",       axis: roll,  range: [-30, 45]}
  - {name: "{side}_hip_yaw",        axis: yaw,   range: [-45, 45]}
  - {name: "{side}_knee",           axis: pitch, range: [0, 135]}  # fully folded, the ankle reaches the hip roll yoke
  - {name: "{side}_ankle_pitch",    axis: pitch, range: [-45, 45]}
  - {name: "{side}_ankle_roll",     axis: roll,  range: [-15, 15]}  # the foot plate clears the roll servo over it (cad.check)
  # torso and head
  - {name: waist_yaw,               axis: yaw,   range: [-90, 90]}
  - {name: neck_yaw,                axis: yaw,   range: [-80, 80]}
  - {name: neck_pitch,              axis: pitch, range: [-20, 30]}  # the head's servo clears the neck yoke looking up, its chin the chest looking down
  # arms: 4 DOF, a wrist yaw (about the forearm) and a one-servo pincer
  - {name: "{side}_shoulder_pitch", axis: pitch, range: [-60, 180]}
  - {name: "{side}_shoulder_roll",  axis: roll,  range: [-15, 120]}  # below -2° only with the arm forward (coupled_limits)
  - {name: "{side}_shoulder_yaw",   axis: yaw,   range: [-30, 90]}  # turned out past 30°, the upper arm's sleeve meets the chest
  - {name: "{side}_elbow",          axis: pitch, range: [0, 130]}  # folded further, the forearm meets the upper arm's sleeve
  - {name: "{side}_wrist_yaw",      axis: yaw,   range: [-150, 150]}
  - {name: "{side}_gripper",        axis: pitch, range: [0, 60]}     # 0 closed, + open

# Limits that depend on another joint (Marvin Bot's form): the joint's lowest angle, piecewise
# linear in the other joint's angle (degrees; beyond the first and last points their values hold).
# Hanging straight, the arm reaches the torso's side at about -2° of shoulder roll; swung forward,
# it can come in to -15° (python -m cad.check checks the points and the midpoints). The
# controller and the retargeter enforce it.
coupled_limits:
  - {joint: "{side}_shoulder_roll", by: "{side}_shoulder_pitch", min: [[0, -2], [30, -2], [60, -15], [150, -15]]}

# One servo drives each joint directly (no linkages at this size). The leg joints and the
# shoulder pitch take the stronger STS3250 (the shoulder pitch for getting up from the back:
# sim/mujoco/check_torques.py, sit-up); the rest of the arms, the waist and neck the STS3215 12 V. Buses: one per leg and one for the upper
# body, so each bus's sync write and sync read fit well inside the control period.
motors:
  # output: the side the horn faces, along the shaft; length: the way the case runs from the
  # shaft (the shaft is 11.5 mm off the case's centre); both in the mount link's frame, left side
  # torque_limit: the share of stall the servo's torque-limit register is set to at setup (the
  # neck holds a 0.2 kg head: it needs under 10%, and its yoke is sized for 30%, cad/fea.py)
  - {name: "{side}_hip_pitch",      model: STS3250,      bus: "{side}_leg", drives: ["{side}_hip_pitch"],      output: [0, 1, 0],  length: [1, 0, 0]}
  - {name: "{side}_hip_roll",       model: STS3250,      bus: "{side}_leg", drives: ["{side}_hip_roll"],       output: [1, 0, 0],  length: [0, 0, 1]}
  - {name: "{side}_hip_yaw",        model: STS3250,      bus: "{side}_leg", drives: ["{side}_hip_yaw"],        output: [0, 0, 1],  length: [1, 0, 0]}
  - {name: "{side}_knee",           model: STS3250,      bus: "{side}_leg", drives: ["{side}_knee"],           output: [0, 1, 0],  length: [0, 0, 1]}
  - {name: "{side}_ankle_pitch",    model: STS3250,      bus: "{side}_leg", drives: ["{side}_ankle_pitch"],    output: [0, 1, 0],  length: [0, 0, 1]}
  - {name: "{side}_ankle_roll",     model: STS3250,      bus: "{side}_leg", drives: ["{side}_ankle_roll"],     output: [1, 0, 0],  length: [0, 1, 0]}
  - {name: waist_yaw,               model: STS3215-C018, bus: upper,        drives: [waist_yaw],               output: [0, 0, 1],  length: [-1, 0, 0]}
  - {name: neck_yaw,                model: STS3215-C018, bus: upper,        drives: [neck_yaw],                output: [0, 0, 1],  length: [-1, 0, 0], torque_limit: 0.3}
  - {name: neck_pitch,              model: STS3215-C018, bus: upper,        drives: [neck_pitch],              output: [0, -1, 0], length: [-1, 0, 0], torque_limit: 0.3}  # in the head, its horn on the neck yoke
  - {name: "{side}_shoulder_pitch", model: STS3250,      bus: upper,        drives: ["{side}_shoulder_pitch"], output: [0, 1, 0],  length: [0, 0, -1]}
  - {name: "{side}_shoulder_roll",  model: STS3215-C018, bus: upper,        drives: ["{side}_shoulder_roll"],  output: [1, 0, 0],  length: [0, 0, 1]}
  - {name: "{side}_shoulder_yaw",   model: STS3215-C018, bus: upper,        drives: ["{side}_shoulder_yaw"],   output: [0, 0, 1],  length: [-1, 0, 0]}  # in the upper arm, its horn up on the roll yoke
  - {name: "{side}_elbow",          model: STS3215-C018, bus: upper,        drives: ["{side}_elbow"],          output: [0, 1, 0],  length: [-1, 0, 0]}
  - {name: "{side}_wrist_yaw",      model: STS3215-C018, bus: upper,        drives: ["{side}_wrist_yaw"],      output: [0, 0, -1], length: [-1, 0, 0]}
  - {name: "{side}_gripper",        model: STS3215-C018, bus: upper,        drives: ["{side}_gripper"],        output: [0, 1, 0],  length: [0, 0, 1]}

# Feetech serial buses: half-duplex TTL at 1 Mbit/s, one USB adapter each. Each control cycle
# sends one sync write (goal positions) and one sync read (position, speed, load) per bus.
# Timing model in tools/check_description.py: 10 bits per byte on the wire, one USB round trip
# per transaction (adapter latency timer at 1 ms), and a turnaround gap per servo reply.
servo_bus:
  baud: 1000000
  bits_per_byte: 10
  usb_latency_s: 0.001      # per transaction; the adapter's latency timer set to 1 ms
  reply_gap_s: 0.0001       # per servo reply: return delay plus line turnaround
  write_bytes: 2            # goal position
  read_bytes: 6             # present position, speed, load
  max_load: 0.5             # share of the control period the bus may be busy
  rate_hz: 50
  buses:
    "{side}_leg": {type: serial}
    upper:        {type: serial}

# Torque rule for the servos (Marvin Bot's is 70% of peak for its motors). Held poses
# (sim/mujoco/check_torques.py): a joint's peak torque stays within this share of stall at the
# pack's empty voltage. Moving (walking policies, sim/mujoco/check_policy.py): a position servo
# saturates at stall for a moment whenever its target steps more than about 10°, so brief
# saturation is allowed, but a joint stays above that limit no longer than max_burst_s at a
# stretch and no more than max_share of a segment. Always: RMS torque within the servo's rating.
torque_rule: {peak_share_of_stall: 0.6, at: v_empty, rms_within_rated: true, moving: {max_burst_s: 0.05, max_share: 0.05}}

power:
  pack: {cells: 3, chemistry: li-ion, capacity_ah: 3.0, v_full: 12.6, v_nominal: 11.1, v_empty: 10.5}
  servo_rail: battery        # the 12 V servos run straight off the pack, through a fuse and the e-stop
  compute_rail: {regulated: true, note: "buck-boost to the Orin Nano dev kit's DC jack (9-20 V); the pack sags below 10 V under load"}
