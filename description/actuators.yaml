# Servo specifications. SI units. "verified: manual" means taken from the manufacturer's
# datasheet; "reseller" means from reseller listings, not yet confirmed by the manufacturer.
# Torques and speeds are at the servo's rated voltage (v_rated); stall torque and no-load speed
# scale roughly with the supply voltage.
#
# Sources:
#   STS3250: Feetech datasheet ST-3250-C001 (the figures Marvin Bot uses for its neck servos)
#   STS3215-C018: reseller listings (30 kg·cm stall and 10 kg·cm rated at 12 V, 0.222 s/60°,
#                 2.7 A stall); the manufacturer's datasheet for the C018 is still to find
#
# model: the provisional servo model used in simulation, after BAM (Rhoban, Apache-2.0,
# https://github.com/Rhoban/bam): the firmware drives the motor with a duty cycle
#   duty = clip(firmware_kp * error_gain * (q_target - q), -max_pwm, max_pwm)
# so the motor sees duty * v_supply, and the output torque is kt * (duty * v - kt * dq) / R,
# less friction. kt and R here are effective output-side values derived from the stall torque
# and no-load speed at full duty (kt = max_pwm * v / w0, R = kt * max_pwm * v / stall), so the
# model reproduces both; error_gain and max_pwm are BAM's oscilloscope figures for the STS3215
# 7.4 V, assumed to hold for the family. Phase 2 replaces
# all of it with a pendulum fit (bench/), which adds friction, armature and command delay.

STS3250:
  vendor: Feetech
  stall_torque: 4.9           # N·m at 12 V
  rated_torque: 1.57          # N·m
  no_load_speed_rpm: 75
  v_rated: 12.0
  voltage: [9, 12.6]
  stall_current: null         # A; to read from the datasheet before the power budget
  gear_ratio: 345
  encoder_steps: 4096         # magnetic, 360°
  mass: 0.0745
  interface: serial
  protocols: [feetech_sts]
  envelope_mm: [45.3, 35.8, 24.8]
  verified: manual
  model:
    kt: 1.482                 # V·s/rad = N·m/A, effective (0.97 x 12 V / 7.85 rad/s)
    R: 3.520                  # ohm, effective (stall 4.9 N·m at 12 V)
    firmware_kp: 32           # the servo's P coefficient (register value); set and logged
    error_gain: 0.166         # duty per (rad x kp unit), BAM's STS3215 figure
    max_pwm: 0.97
    armature: 0.02            # kg·m², reflected rotor inertia: BAM's STS3215 fit (0.022), as a placeholder
    basis: datasheet-derived  # replaced by the phase 2 fit

STS3215-C018:
  vendor: Feetech
  stall_torque: 2.94          # N·m at 12 V (30 kg·cm)
  rated_torque: 0.98          # N·m (10 kg·cm)
  no_load_speed_rpm: 45       # 0.222 s/60°
  v_rated: 12.0
  voltage: [4, 14]
  stall_current: 2.7          # A at 12 V
  gear_ratio: 345
  encoder_steps: 4096
  mass: 0.055                 # to weigh
  interface: serial
  protocols: [feetech_sts]
  envelope_mm: [45.2, 35.0, 24.7]  # same case as the STS3250 (approximate)
  verified: reseller
  model:
    kt: 2.470                 # effective (0.97 x 12 V / 4.71 rad/s)
    R: 9.780                  # effective (stall 2.94 N·m at 12 V)
    firmware_kp: 32
    error_gain: 0.166
    max_pwm: 0.97
    armature: 0.02            # BAM's STS3215 7.4 V fit: 0.022
    basis: datasheet-derived
